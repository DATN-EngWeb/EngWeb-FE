services:
  frontend:
    build: .
    container_name: english_app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=development
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: npm run dev
volumes:
  node_modules:

